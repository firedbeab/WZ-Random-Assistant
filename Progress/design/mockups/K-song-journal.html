$('#scroll').addEventListener('touchstart',e=>{const t=e.touches.length===1&&e.touches[0];touch=t&&!sheet&&t.clientX-$('#phone').getBoundingClientRect().left>24?{x:t.clientX,y:t.clientY,time:Date.now()}:null;},{passive:true});$('#scroll').addEventListener('touchend',e=>{const t=e.changedTouches[0],s=touch;touch=null;if(!s||!t||Date.now()-s.time>650)return;const dx=t.clientX-s.x,dy=t.clientY-s.y;if(Math.abs(dx)>64&&Math.abs(dx)>Math.abs(dy)*1.8)changeMonth(dx<0?1:-1);},{passive:true});$('#scroll').addEventListener('touchcancel',()=>touch=null,{passive:true});
document.addEventListener('keydown',e=>{if(!sheet)return;if(e.key==='Escape'){closeSheet();return;}if(e.key==='Tab'){const list=[...$('.sheet').querySelectorAll('button:not(:disabled)')];if(e.shiftKey&&(document.activeElement===list[0]||document.activeElement===$('.sheet'))){e.preventDefault();list.at(-1).focus();}else if(!e.shiftKey&&(document.activeElement===list.at(-1)||document.activeElement===$('.sheet'))){e.preventDefault();list[0].focus();}}});
document.addEventListener('pointerdown',e=>{if(!e.target.closest('.handle')||!sheet||closing)return;drag={id:e.pointerId,y:e.clientY};e.target.setPointerCapture(e.pointerId);});document.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id||!$('.sheet'))return;$('.sheet').style.transform='translateY('+Math.max(0,e.clientY-drag.y)+'px)';});function endDrag(e){if(!drag||e.pointerId!==drag.id)return;const delta=e.clientY-drag.y;drag=null;if(delta>60)closeSheet();else if($('.sheet')){const panel=$('.sheet');panel.style.transition='transform 180ms ease';panel.style.transform='';}}document.addEventListener('pointerup',endDrag);document.addEventListener('pointercancel',()=>{drag=null;if($('.sheet'))$('.sheet').style.transform='';});
render();
</script></body></html>
