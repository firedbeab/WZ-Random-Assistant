<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>样张 A · 首页（浅色）</title>
<style>
  :root{
    --bg:#f4f2ef; --surface:#ffffff; --surface2:#edebe7;
    --t1:#1b1b1d; --t2:#5f6066; --t3:#9a9ba1;
    --accent:#2d8057; --accent-weak:#e8f2ec;
    --r-md:7px; --r-lg:10px; --r-pill:999px;
    --shadow-sm:0 2px 8px rgba(60,50,40,.05);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased}
  body{
    width:375px;height:812px;background:var(--bg);color:var(--t1);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    overflow:hidden;position:relative;
  }
  .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}

  /* 每周渐变：0-356px，底部与页面底色融合 */
  .hero{
    position:absolute;inset:0 0 auto 0;height:356px;
    background:linear-gradient(170deg,#dcebe1 0%,#eef0e9 55%,#f4f2ef 100%);
    padding:58px 24px 0;
  }
  .week{font-size:11px;letter-spacing:.6px;color:#6f8378}
  .title{margin-top:34px;font-size:30px;font-weight:600;letter-spacing:-.3px;line-height:1.25}
  .sub{margin-top:8px;font-size:13px;color:var(--t2);line-height:1.5}
  .cta{
    margin-top:30px;height:52px;border-radius:var(--r-pill);
    background:var(--accent);color:#fff;font-size:16px;font-weight:500;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 16px rgba(45,128,87,.18);
  }
  .cta-sub{margin-top:14px;text-align:center;font-size:13px;color:var(--accent)}

  /* 下方内容区 */
  .body{padding:356px 24px 0}
  .stat{
    margin-top:26px;display:flex;align-items:center;gap:8px;
    font-size:13px;color:var(--t2);
  }
  .stat .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);opacity:.85}
  .stat b{font-weight:600;color:var(--t1);font-size:15px}

  .tips{margin-top:22px;font-size:12px;color:var(--t3);line-height:1.75}

  /* 底部入口 */
  .foot{
    position:absolute;left:24px;right:24px;bottom:34px;
    display:flex;justify-content:space-between;align-items:center;
    font-size:12.5px;color:var(--t3);
  }
  .foot .group{display:flex;gap:20px}
</style>
</head>
<body>
  <div class="hero">
    <div class="week num">第 44 周 · 2026.10.25</div>
    <div class="title">现在可以点歌</div>
    <div class="sub">周日 8:00 – 20:00 开放提交，本周还剩 <span class="num">6</span> 小时</div>
    <div class="cta">点歌</div>
    <div class="cta-sub">查看本期歌单</div>
  </div>

  <div class="body">
    <div class="stat num"><span class="dot"></span>本周已有 <b>12</b> 人提交，本期将抽取 20 首</div>
    <div class="tips">提交后可在周日晚查看抽取结果。<br>每人每周一次机会，被抽中会收到通知。</div>
  </div>

  <div class="foot">
    <div class="group"><span>我的</span><span>使用说明</span></div>
    <span>v2.0</span>
  </div>
<script>
  // 让 375px 设计稿在任何视口宽度下铺满，截图对比时比例不失真
  (function () {
    var apply = function () {
      var z = window.innerWidth / 375;
      document.documentElement.style.zoom = String(z);
      // 缩放后让内容高度正好等于视口高度，避免底部被裁掉
      document.body.style.height = (window.innerHeight / z) + 'px';
    };
    apply();
    window.addEventListener('resize', apply);
  })();
</script>
</body>
</html>
