let days=makeDays(),codes=[{id:1,code:'7K3W9A',published:true,expire:'2026-11-01'},{id:2,code:'N8C4RX',published:false,expire:'2026-11-01'}];

let eggs=[{id:1,top:'今天的小幸运',bottom:'是和小猫碰个面。',enabled:true,image:true},{id:2,top:'再试一次，说不定就遇见了。',bottom:'',enabled:false,image:true}];
let submissions=[{id:1,name:'夜曲',singer:'周杰伦',note:'希望安排在周五',status:'pending',week:'2026-10-25'},{id:2,name:'晴天',singer:'周杰伦',note:'',status:'selected',week:'2026-10-25'},{id:3,name:'起风了',singer:'买辣椒也用券',note:'',status:'carryover',week:'2026-10-18'},{id:4,name:'如愿',singer:'王菲',note:'',status:'removed',week:'2026-10-25'}];

const state={page:'audit',role:'super',scope:'test',scenario:'normal',bulkDay:null,checked:new Set(),removed:new Map(),skipped:new Set(),replaced:new Map(),note:'',subscribed:false,published:false,history:[],topic:'submissions',week:'all',status:'all',search:'',recordSelected:new Set(),channel:'normal',sheet:null,dirty:false,editing:false,editId:null,schedulePublished:true,scheduleDraft:null,scheduleSaved:null,counter:128};
let toastTimer,lastFocus,sheetExpiryTimer,sheetExpiry=0,sheetPayload={},sheetAfter=null,sheetSnapshot=null;

const activeSongs=()=>days.flatMap((d,i)=>daySongs(i)).filter(s=>!state.removed.has(s.id));
const effectiveDays=()=>days.filter((d,i)=>daySongs(i).some(s=>!state.removed.has(s.id))).length;
function toast(message){$('toast').textContent=message;$('toast').classList.add('visible');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('visible'),2500)}
function requestCloseSheet(){
if(state.sheet==='egg'&&state.eggDirty){
sheetSnapshot={title:$('sheetTitle').textContent,caption:$('sheetCaption').textContent,body:$('sheetBody').innerHTML,actions:$('sheetActions').innerHTML,payload:sheetPayload,fields:Array.from($('sheetBody').querySelectorAll('input,textarea,select')).map(n=>({id:n.id,value:n.value,checked:n.checked}))};

function navigate(page,arg=null){if(state.role!=='super'&&!['audit','codes'].includes(page))return;const proceed=()=>{state.history.push({page:state.page,editId:state.editId});state.page=page;state.editId=arg;state.editing=false;state.dirty=false;state.bulkDay=null;state.checked.clear();if(page==='helpEdit')state.helpDraft=JSON.parse(JSON.stringify(articles.find(a=>a.id===Number(arg))||{title:'',summary:'',content:'',images:[],published:false}));if(page==='schedule'){state.schedulePublished=arg!=='pending';state.scheduleSaved=makeDays();state.scheduleDraft=JSON.parse(JSON.stringify(state.scheduleSaved))}closeSheet();render(true)};if(state.dirty){sheetAfter=proceed;sheet('离开编辑？','当前更改尚未保存','<p class="sheet-copy">可以继续编辑，或放弃本次更改后离开。</p>',btn('继续编辑','close','','secondary')+btn('放弃并离开','discard','','danger-outline'),'discard')}else proceed()}

function audit(){let out=state.scenario==='old'?'<div class="notice">这是上一期排期，请核对播出日期后再发布。</div>':'';if(state.scenario==='none'||state.published)return out+'<div class="state-box"><h3>'+(state.published?'本期发布已演示':'没有待审核排期')+'</h3><p>'+(state.published?'刷新页面可重置示例，真实数据未改变。':'等待周日抽取，也可以下拉刷新核对。')+'</p>'+btn('刷新示例','refresh','','text-btn accent')+'</div>';if(state.scenario==='error')return out+'<div class="state-box"><h3>排期暂时未能加载</h3><p>请检查网络后重新加载。</p>'+btn('重新加载','retry','','text-btn accent')+'</div>';out+='<div class="tool-row"><button class="text-btn" data-act="tips">审核要点</button><span class="small">长按曲目可复制</span></div>';if(state.scenario==='flags'&&!state.replaced.has('s0')&&!state.removed.has('s0')&&!state.skipped.has(0))out+='<div class="notice">有一首曲目需要核对版本，请先检查备注。</div>';out+='<div class="card">';days.forEach((d,di)=>{const list=daySongs(di),effective=list.filter(s=>!state.removed.has(s.id)).length;out+='<section class="day"><div class="day-head"><h3>'+d.name+'</h3><span class="day-date">10月'+(26+di)+'日</span><span class="day-count">'+effective+'首</span>'+btn(state.bulkDay===di?'取消':'选择','batch',di,'text-btn',list.length?'':'disabled')+btn('跳过','skip',di,'text-btn',list.length?'':'disabled')+'</div>';if(!list.length)out+='<p class="empty-day">'+(state.skipped.has(di)?'当天已跳过，曲目转回候补。':'当天没有曲目安排。')+'</p>';list.forEach((original,si)=>{const s=state.replaced.get(original.id)||original,removed=state.removed.has(s.id),batch=state.bulkDay===di;out+='<div class="song-row '+(removed?'removed':'')+'"><div class="song-lead">'+(batch&&!removed?btn('<span class="check" role="checkbox" aria-checked="'+state.checked.has(s.id)+'">'+(state.checked.has(s.id)?ic('check'):'')+'</span>','check',s.id,'check-wrap','aria-label="选择'+esc(s.name)+'"'):'<span class="song-index">'+(si+1)+'</span>')+'</div><div class="song-copy" data-copy="'+esc(s.id)+'"><div class="song-line"><span class="song-name">'+esc(s.name)+'</span><span class="song-singer">'+esc(s.singer)+'</span></div>'+(s.note?'<p class="song-note">'+esc(s.note)+'</p>':'')+(removed?'<p class="song-state">待移除 · 不补位</p>':'')+'</div>'+(removed?btn('撤销','restore',s.id,'text-btn accent'):btn(ic('more'),'song',s.id,'icon-btn','aria-label="'+esc(s.name)+'的操作"'))+'</div>'});out+='</section>'});out+='</div><details class="week-note" '+(state.note?'open':'')+'><summary>发布说明'+(state.note?' · 已填写':'（选填）')+'</summary><textarea id="weekNote" class="field-area" maxlength="100" placeholder="填写面向用户的本期说明">'+esc(state.note)+'</textarea><p class="small">发布时与歌单一同展示；没有曲目时必填。</p></details>';return out}

function commit(act,arg){if(act==='note-delete'){const s=state.replaced.get(arg)||song(arg);s.note=''}const reason=$('confirmReason')?$('confirmReason').value.trim():'';if(['withdraw','record-remove'].includes(act)&&!reason)return toast('请填写原因');

  if(act==='bulk-remove'){state.checked.forEach(id=>state.removed.set(id,reason||'当天安排调整'));state.checked.clear();state.bulkDay=null}
  if(act==='skip'){const di=Number(arg);state.skipped.add(di);days[di].songs.forEach(s=>state.removed.delete(s.id));state.checked.clear();state.bulkDay=null}
  if(act==='code-delete')codes=codes.filter(c=>c.id!==Number(arg));
  if(act==='code-publish'){const c=codes.find(c=>c.id===Number(arg));c.published=true}
  if(act==='channel')state.channel=arg;
  if(act==='record-remove'){const ids=arg?[Number(arg)]:Array.from(state.recordSelected);submissions.forEach(s=>{if(ids.includes(s.id)&&!['selected','rejected'].includes(s.status))s.status='removed'});state.recordSelected.clear()}

  if(act==='withdraw'){state.schedulePublished=false}
  if(act==='counter-save')state.counter=Number(arg);
  if(act==='help-toggle'){const a=articles.find(a=>a.id===Number(arg));a.published=!a.published}
  if(act==='help-delete')articles=articles.filter(a=>a.id!==Number(arg));
  if(act==='help-save')return saveHelp(true);
  if(act==='egg-delete')eggs=eggs.filter(e=>e.id!==Number(arg));
  if(act==='revoke')people=people.filter(p=>p.id!==Number(arg)||p.role==='super');
  if(act==='pass-delete')passes=passes.filter(p=>p.id!==Number(arg));
  closeSheet();render();toast('已完成本页演示，真实数据未改变');
}
$('device').addEventListener('click',e=>{if(e.target===$('overlay'))return requestCloseSheet();const button=e.target.closest('[data-act]');if(button&&!button.disabled)dispatch(button.dataset.act,button.dataset.arg||'',button)});
$('device').addEventListener('contextmenu',e=>{const node=e.target.closest('[data-copy]');if(node){e.preventDefault();const s=state.replaced.get(node.dataset.copy)||song(node.dataset.copy);copyText(s.name+' - '+s.singer+(s.note?'\n备注：'+s.note:''))}});
let longTimer,longStart;
$('device').addEventListener('pointerdown',e=>{const node=e.target.closest('[data-copy]');if(!node)return;longStart=[e.clientX,e.clientY];longTimer=setTimeout(()=>{const s=state.replaced.get(node.dataset.copy)||song(node.dataset.copy);copyText(s.name+' - '+s.singer+(s.note?'\n备注：'+s.note:''))},550)});
$('device').addEventListener('pointermove',e=>{if(longStart&&Math.hypot(e.clientX-longStart[0],e.clientY-longStart[1])>10)clearTimeout(longTimer)});
['pointerup','pointercancel'].forEach(name=>$('device').addEventListener(name,()=>{clearTimeout(longTimer);longStart=null}));
$('device').addEventListener('input',e=>{if(state.sheet==='egg')state.eggDirty=true;if(e.target.id==='weekNote')state.note=e.target.value;if(e.target.id==='publishNote'&&$('publishConfirm'))$('publishConfirm').disabled=!activeSongs().length&&!e.target.value.trim();if(e.target.id==='cleanupPhrase'&&$('cleanupConfirm'))$('cleanupConfirm').disabled=e.target.value!==sheetPayload.phrase||Date.now()>sheetExpiry;if(state.page==='helpEdit'&&['helpTitle','helpSummary','helpContent'].includes(e.target.id)){snapshotHelp();state.dirty=true}if(state.page==='submission'&&state.editing)state.dirty=true;if(state.page==='schedule'&&state.editing){const match=e.target.id.match(/^schedule(Name|Singer|Note)(\d+)-(\d+)$/);if(match){state.scheduleDraft[Number(match[2])].songs[Number(match[3])][{Name:'name',Singer:'singer',Note:'note'}[match[1]]]=e.target.value;state.dirty=true}if(e.target.id==='scheduleNote'){state.scheduleNote=e.target.value;state.dirty=true}}});
$('device').addEventListener('change',e=>{if(state.sheet==='egg')state.eggDirty=true;if(e.target.id==='weekFilter'){state.week=e.target.value;state.recordSelected.clear();render()}if(e.target.id==='statusFilter'){state.status=e.target.value;state.recordSelected.clear();render()}if(e.target.id==='eventFilter'){const i=e.target.selectedIndex;[0,1].forEach(n=>{$('event'+n).parentElement.hidden=i!==0&&i!==n+1});let p=$('emptyEvents');if(!p){p=document.createElement('p');p.id='emptyEvents';p.className='pad muted';p.textContent='暂无该类事件';e.target.nextElementSibling.append(p)}p.hidden=i!==3}});
document.addEventListener('keydown',e=>{if($('overlay').hidden)return;if(e.key==='Escape'){e.preventDefault();requestCloseSheet()}if(e.key==='Tab'){const list=Array.from($('overlay').querySelectorAll('button:not([disabled]),input,textarea,select')).filter(n=>n.offsetParent!==null),first=list[0],last=list[list.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
$('role').addEventListener('change',e=>{state.role=e.target.value;state.page='audit';state.history=[];state.editing=false;state.dirty=false;closeSheet();render(true)});
$('pageSelect').addEventListener('change',e=>navigate(e.target.value));
$('scenario').addEventListener('change',e=>{state.scenario=e.target.value;resetScenario()});
$('width').addEventListener('change',e=>document.documentElement.style.setProperty('--phone-width',e.target.value+'px'));
$('scope').addEventListener('change',e=>{state.scope=e.target.value;closeSheet();render()});
const media=matchMedia('(prefers-color-scheme: dark)');
function theme(){const v=$('theme').value;document.documentElement.dataset.theme=v==='system'?(media.matches?'dark':'light'):v}
$('theme').addEventListener('change',theme);media.addEventListener('change',theme);
const params=new URLSearchParams(location.search);if(params.get('theme')==='dark'){$('theme').value='dark'}if(params.get('role')==='admin'){state.role='admin';$('role').value='admin'}theme();render();
</script>
</body>
</html>
