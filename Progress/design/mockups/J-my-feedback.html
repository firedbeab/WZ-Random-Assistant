  <div class="eyebrow">J / 第一版交互预览</div>
  <h1>我的与反馈，<br>先做好这几件事。</h1>
  <p>沿用当前页面的留白、绿色强调和内容卡片。左侧切换角色入口，手机内可以继续提交、查看、回复与投票。</p>

    <button data-route="feedback">反馈中心 · 使用反馈</button>
    <button data-route="vote">反馈中心 · 功能投票</button>
    <div class="nav-section">超级管理员</div>
    <button data-route="admin-feedback">管理 · 使用反馈</button>
    <button data-route="admin-vote">管理 · 功能投票</button>
  </nav>

  <div class="boundary"><p><strong>独立 HTML，不改正式页面。</strong><br>所有内容均为演示数据，只存在当前页面内存；刷新恢复，不连接数据库，不发送消息。</p><p>可试一条完整流程：用户提交反馈 → 超管回复 → 用户查看回复。投票也在两端同步。</p><p>本版仅演示称呼编辑、三类入口与反馈处理。用户名管理和旧数据保留策略另行讨论。</p></div>

{id:'F106',user:me,alias:'点歌同学',category:'使用问题',body:'深色模式下，有几处提示文字和背景比较接近，晚上看不太清楚。希望能再明显一点。',status:'handling',time:'10月27日 14:20',version:'v1.9',reply:'',unread:false},

let state=initialState(),sheet=null,confirmation=null,toastTimer=null,focusBefore=null,closing=false,closeTimer=null,serial=200;
function userName(f){return f.user===me?state.alias:f.alias;}
function badge(status){return '<span class="badge '+esc(status)+'">'+esc(statusNames[status]||status)+'</span>';}
function updateTheme(){const dark=state.mode==='dark'||(state.mode==='system'&&matchMedia('(prefers-color-scheme:dark)').matches);document.documentElement.dataset.theme=dark?'dark':'light';document.documentElement.dataset.palette=state.palette;$('#theme-control').textContent=dark?'切换浅色':'切换深色';}

function myPage(){const unread=state.feedbacks.filter(f=>f.user===me&&f.unread).length;return heading('我的','')+
'<div class="nickname"><span>'+esc(state.alias)+'</span><button class="text-button" data-action="alias" aria-label="修改称呼">'+icon('edit')+'修改称呼</button></div>'+

'<div class="surface entry-list">'+entry('paint','外观设置','浅深模式与主题配色','appearance')+entry('message','反馈中心','提建议、看回复、参与投票','feedback',unread)+entry('paw','彩蛋图鉴','已遇见 3 / 12 种文字猫','catalog')+'</div>'+

function feedbackForm(){const mine=state.feedbacks.filter(f=>f.user===me);return '<form id="feedback-form" class="surface form-card" novalidate><label class="field-label" for="feedback-text">想和我们说什么？</label><div class="chips">'+['使用问题','功能建议','其他'].map(c=>'<button type="button" class="chip '+(state.category===c?'selected':'')+'" data-action="category" data-value="'+c+'" aria-pressed="'+(state.category===c)+'">'+c+'</button>').join('')+'</div><textarea class="feedback-text" id="feedback-text" maxlength="500" placeholder="遇到了什么问题，或希望增加什么功能？">'+esc(state.feedbackText)+'</textarea><div class="field-meta"><span>附带版本 v1.9，便于排查</span><span id="feedback-count">'+Array.from(state.feedbackText).length+' / 500</span></div><p class="error" id="feedback-error" role="alert" hidden></p><button class="primary" type="submit">提交反馈</button><p class="privacy-note">反馈内容仅你与管理者可见</p></form><div class="section-row"><h2 class="section-title">我的反馈</h2><span class="small">'+mine.length+' 条</span></div><div class="surface feedback-list">'+(mine.length?mine.map(f=>feedbackRow(f,false)).join(''):'<div class="empty"><h2>还没有提交反馈</h2><p>遇到问题或有新想法，都可以告诉我们。</p></div>')+'</div><div class="page-footer">回复会保留在这里，方便下次查看。</div>';}

function adminPage(){const voting=state.route==='admin-vote';const scoped=state.feedbacks.filter(f=>!state.userFilter||f.user===state.userFilter);let rows=scoped.filter(f=>state.filter==='all'||f.status===state.filter);const received=scoped.filter(f=>f.status==='received').length,handling=scoped.filter(f=>f.status==='handling').length;

(voting?'<div class="section-row"><span class="muted small">维护候选功能和投票时间</span><button class="text-button" data-action="new-poll">＋ 新建投票</button></div>'+state.polls.map(p=>pollCard(p,true)).join(''):

function pollCard(p,admin){const total=p.options.reduce((n,o)=>n+o.count,0),results=admin||p.closed||(p.choice&&!p.editing),selected=results?p.choice:p.draft;
return '<section class="surface poll"><div class="card-head"><span class="badge '+(p.closed?'done':'handling')+'">'+(p.closed?'已结束':'进行中')+'</span><span class="small num">'+esc(p.end)+(p.closed?' 结束':' 截止')+'</span></div><h2>'+esc(p.title)+'</h2><p class="poll-description">'+esc(p.description)+'</p>'+p.options.map(o=>{

(admin?'<div class="poll-actions">'+(!p.closed?'<button class="secondary" data-action="end-poll" data-id="'+p.id+'">结束投票</button>':'')+'<button class="secondary" data-action="poll-summary" data-id="'+p.id+'">查看结果</button></div>':!p.closed&&(!p.choice||p.editing)?'<button class="primary" data-action="submit-vote" data-id="'+p.id+'" '+(!p.draft?'disabled':'')+'>'+(p.choice?'保存选择':'确认投票')+'</button>':'')+
'<div class="poll-foot"><span>'+total+' 人参与'+(!admin&&!p.closed?' · 单选，截止前可修改':'')+'</span>'+(!admin&&p.choice&&!p.closed?'<button class="text-button" data-action="edit-vote" data-id="'+p.id+'">修改选择</button>':'')+'</div></section>';}

function showSheet(type,data){if(sheet){requestClose(()=>showSheet(type,data));return;}focusBefore=document.activeElement;sheet={type,data:data||{},dirty:false};renderSheet();$('#device').classList.add('sheet-open');setTimeout(()=>{const e=$('#sheet-root input,#sheet-root textarea,#sheet-root button:not(.sheet-grip)');if(e)e.focus({preventScroll:true});},40);}

function renderSheet(){if(!sheet)return;let title='',body='',footer='';const d=sheet.data;
if(sheet.type==='alias'){title='设置称呼';body='<p class="sheet-description">给自己起一个喜欢的称呼，用于点歌和反馈页面的显示。</p><input class="field alias-input" id="alias-input" value="'+esc(state.alias)+'" maxlength="12" aria-label="称呼"><div class="field-meta"><span>2–12 个字</span><span>不用填写真实姓名</span></div><p id="alias-error" class="error" role="alert" hidden></p>';footer='<button class="secondary" data-action="close-sheet">取消</button><button class="primary" data-action="save-alias">保存称呼</button>';}

if(sheet.type==='submission'){title='本周点歌';body='<div class="card-head"><span class="badge handling">已提交</span><span class="small">2026.10.25 期</span></div><h3 class="current-song">稻香</h3><p class="current-singer">周杰伦</p><div class="reply"><h3>特殊备注</h3><p>希望播放原版，送给认真生活的每一个人。</p></div><p class="sheet-description" style="margin-top:22px">最终安排以已发布歌单为准，本周无需再次提交。</p>';footer='<button class="primary" data-action="close-sheet">知道了</button>';}
if(sheet.type==='catalog'){title='彩蛋图鉴';body='<p class="sheet-description">已遇见 3 / 12 种文字猫</p><div class="catalog">'+Array.from({length:12},(_,i)=>'<div class="catalog-cell '+(i<3?'seen':'')+'">'+icon(i<3?'paw':'lock')+(i<3?['认真生活猫','晚安猫','好运猫'][i]:'尚未遇见')+'</div>').join('')+'</div><p class="small" style="margin-top:20px">遇见记录保存在本机，清理缓存或更换设备后可能无法保留。</p>';footer='<button class="primary" data-action="close-sheet">完成</button>';}
if(sheet.type==='detail'||sheet.type==='admin-detail'){const f=state.feedbacks.find(x=>x.id===d.id),admin=sheet.type==='admin-detail';if(!f)return;title=admin?'处理反馈':'反馈详情';body='<div class="card-head"><span class="feedback-category">'+esc(f.category)+'</span>'+badge(f.status)+'</div><p class="detail-copy">'+esc(f.body)+'</p><p class="detail-meta">'+esc(f.time)+' · '+esc(f.version)+'</p>';
if(admin){body+='<button class="text-button" style="padding-left:0" data-action="same-user" data-user="'+f.user+'">'+esc(userName(f))+' · '+esc(f.user)+' '+icon('right')+'</button><div class="field-group"><p class="field-label">处理状态</p><div class="chips">'+Object.entries(statusNames).map(x=>'<button class="chip '+(d.status===x[0]?'selected':'')+'" data-action="reply-status" data-value="'+x[0]+'">'+x[1]+'</button>').join('')+'</div></div><div class="field-group"><label class="field-label" for="reply-input">回复用户 <small>选填</small></label><textarea class="field" id="reply-input" rows="4" maxlength="500" placeholder="告诉对方处理情况或后续安排">'+esc(d.reply)+'</textarea><p class="small" style="margin-top:8px">保存后，用户可在“我的反馈”中查看。</p></div>';footer='<button class="secondary" data-action="close-sheet">取消</button><button class="primary" data-action="save-reply">保存处理</button>';}
else{body+=f.reply?'<div class="reply"><h3>管理者回复</h3><p>'+esc(f.reply)+'</p><time>'+esc(f.replyTime)+'</time></div>':'<p class="sheet-description" style="margin-top:22px">我们会认真查看，处理结果和回复会显示在这里。</p>';footer='<button class="primary" data-action="close-sheet">完成</button>';}}
if(sheet.type==='new-poll'){title='新建功能投票';body='<div class="field-group"><label class="field-label" for="poll-title">投票问题</label><input class="field" id="poll-title" maxlength="50" value="'+esc(d.title)+'" placeholder="下一步，你最期待什么？"></div><div class="field-group"><label class="field-label" for="poll-description">补充说明 <small>选填</small></label><textarea class="field" id="poll-description" rows="2" maxlength="100" placeholder="说明这轮投票的用途">'+esc(d.description)+'</textarea></div><div class="field-group"><p class="field-label">候选选项 <small>2–4 项</small></p>'+d.options.map((x,i)=>'<div class="option-editor"><span>'+String(i+1).padStart(2,'0')+'</span><input class="field" data-option-input="'+i+'" maxlength="30" aria-label="选项'+(i+1)+'" value="'+esc(x)+'" placeholder="填写候选功能">'+(d.options.length>2?'<button class="icon-button" data-action="remove-option" data-index="'+i+'" aria-label="删除选项'+(i+1)+'">'+icon('close')+'</button>':'')+'</div>').join('')+(d.options.length<4?'<button class="text-button" data-action="add-option">＋ 添加选项</button>':'')+'</div><div class="field-group"><p class="field-label">持续时间</p><div class="chips">'+[3,7,14].map(n=>'<button class="chip '+(d.days===n?'selected':'')+'" data-action="poll-days" data-value="'+n+'">'+n+' 天</button>').join('')+'</div></div><p class="error" id="poll-error" role="alert" hidden></p>';footer='<button class="secondary" data-action="close-sheet">取消</button><button class="primary" data-action="publish-poll">发布投票</button>';}

$('#sheet-root').innerHTML=sheetParts(title,body,footer);attachGrip();}
function closeSheet(after){if(closing||!sheet)return;closing=true;$('.sheet').style.animation='';$('#sheet-mask').classList.add('closing');closeTimer=setTimeout(()=>{sheet=null;closing=false;closeTimer=null;$('#sheet-root').innerHTML='';$('#device').classList.remove('sheet-open');if(focusBefore&&document.contains(focusBefore))focusBefore.focus({preventScroll:true});if(after)after();},300);}
function requestClose(after){if(!sheet){if(after)after();return;}if(sheet.dirty){ask('放弃这次修改？','未保存的内容不会提交。','放弃修改',()=>{sheet.dirty=false;closeSheet(after);},true);}else closeSheet(after);}
function ask(title,text,label,fn,danger){confirmation={fn};$('#confirm-root').innerHTML='<div class="confirm-mask"><section class="confirm-card" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title"><h2 id="confirm-title">'+esc(title)+'</h2><p>'+esc(text)+'</p><div class="confirm-actions"><button class="secondary" data-action="cancel-confirm">再想想</button><button class="'+(danger?'danger-button':'primary')+'" data-action="accept-confirm">'+esc(label)+'</button></div></section></div>';$('#confirm-root .secondary').focus();}
function dismissConfirm(){confirmation=null;$('#confirm-root').innerHTML='';}
function timestamp(){return new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',month:'long',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date());}
function errorAt(id,text){const el=$(id);if(el){el.hidden=false;el.textContent=text;}}
function action(name,b){const v=b.dataset.value,id=b.dataset.id;
if(name==='alias'||name==='appearance'||name==='submission'||name==='catalog')return showSheet(name);

if(name==='category'){state.category=v;render();$('#feedback-text').focus({preventScroll:true});return;}
if(name==='filter'){state.filter=v;render();return;}
if(name==='clear-user-filter'){state.userFilter=null;render();return;}
if(name==='detail'){const f=state.feedbacks.find(x=>x.id===id);f.unread=false;render();return showSheet('detail',{id});}
if(name==='admin-detail'){const f=state.feedbacks.find(x=>x.id===id);return showSheet('admin-detail',{id,status:f.status,reply:f.reply});}
if(name==='close-sheet')return requestClose();
if(name==='cancel-confirm')return dismissConfirm();
if(name==='accept-confirm'){const f=confirmation&&confirmation.fn;dismissConfirm();if(f)f();return;}
if(name==='save-alias'){const value=$('#alias-input').value.trim();if(Array.from(value).length<2||Array.from(value).length>12)return errorAt('#alias-error','请输入 2–12 个字的称呼。');state.alias=value;sheet.dirty=false;render();closeSheet(()=>toast('称呼已更新'));return;}
if(name==='mode'){state.mode=v;updateTheme();renderSheet();return;}
if(name==='palette'){state.palette=v;updateTheme();renderSheet();return;}
if(name==='reply-status'){sheet.data.status=v;sheet.dirty=true;renderSheet();return;}
if(name==='save-reply'){const f=state.feedbacks.find(x=>x.id===sheet.data.id);f.status=sheet.data.status;const oldReply=f.reply;f.reply=sheet.data.reply.trim();if(!f.reply){f.replyTime='';f.unread=false;}else if(f.reply!==oldReply){f.replyTime=timestamp();f.unread=true;}sheet.dirty=false;render();closeSheet(()=>toast('处理结果已保存'));return;}
if(name==='same-user'){const user=b.dataset.user;return requestClose(()=>{state.userFilter=user;state.filter='all';route('admin-feedback');});}
if(name==='new-poll')return showSheet('new-poll',{title:'',description:'',options:['',''],days:7});
if(name==='add-option'){sheet.data.options.push('');sheet.dirty=true;renderSheet();return;}
if(name==='remove-option'){sheet.data.options.splice(Number(b.dataset.index),1);sheet.dirty=true;renderSheet();return;}
if(name==='poll-days'){sheet.data.days=Number(v);sheet.dirty=true;renderSheet();return;}
if(name==='publish-poll'){const d=sheet.data,title=d.title.trim(),options=d.options.map(x=>x.trim());if(!title)return errorAt('#poll-error','请填写投票问题。');if(options.some(x=>!x))return errorAt('#poll-error','请补齐候选选项。');if(new Set(options).size!==options.length)return errorAt('#poll-error','候选选项不能重复。');const end=new Date(Date.now()+d.days*86400000);const date=new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'}).format(end).replace(/\//g,'.');state.polls.unshift({id:'P'+(++serial),title,description:d.description.trim()||'投票用于参考开发优先级。',end:date,closed:false,choice:null,draft:null,editing:false,options:options.map((label,i)=>({id:String(i),label,count:0}))});sheet.dirty=false;render();closeSheet(()=>toast('功能投票已发布'));return;}
if(name==='poll-choice'){const p=state.polls.find(x=>x.id===id);if(p.closed)return;p.draft=b.dataset.option;render();return;}
if(name==='submit-vote'){const p=state.polls.find(x=>x.id===id);if(p.closed||!p.draft)return;if(p.choice){const old=p.options.find(x=>x.id===p.choice);old.count--;}p.options.find(x=>x.id===p.draft).count++;p.choice=p.draft;p.editing=false;render();toast('你的选择已记录');return;}
if(name==='edit-vote'){const p=state.polls.find(x=>x.id===id);p.editing=true;p.draft=p.choice;render();return;}
if(name==='end-poll'){const p=state.polls.find(x=>x.id===id);return ask('结束这轮投票？','结束后保留统计结果，用户将无法继续投票或修改选择。','结束投票',()=>{p.closed=true;render();toast('投票已结束');},true);}
if(name==='poll-summary')return showSheet('summary',{id});
}
document.addEventListener('click',e=>{const routeButton=e.target.closest('[data-route]');if(routeButton){route(routeButton.dataset.route);return;}const b=e.target.closest('[data-action]');if(b){action(b.dataset.action,b);return;}if(e.target.id==='sheet-mask')requestClose();});
document.addEventListener('input',e=>{const t=e.target;if(t.id==='feedback-text'){state.feedbackText=t.value;$('#feedback-count').textContent=Array.from(t.value).length+' / 500';$('#feedback-error').hidden=true;return;}if(!sheet)return;sheet.dirty=true;if(t.id==='reply-input')sheet.data.reply=t.value;if(t.id==='poll-title')sheet.data.title=t.value;if(t.id==='poll-description')sheet.data.description=t.value;if(t.hasAttribute('data-option-input'))sheet.data.options[Number(t.dataset.optionInput)]=t.value;});
document.addEventListener('submit',e=>{if(e.target.id!=='feedback-form')return;e.preventDefault();const body=state.feedbackText.trim();if(!body)return errorAt('#feedback-error','请先写下你遇到的问题或建议。');state.feedbacks.unshift({id:'F'+(++serial),user:me,alias:state.alias,category:state.category,body,status:'received',time:timestamp(),version:'v1.9',reply:'',unread:false});state.feedbackText='';render();toast('反馈已收到，可在下方查看');});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(confirmation)dismissConfirm();else if(sheet)requestClose();}if(e.key==='Enter'&&e.target.id==='sheet-grip')requestClose();if(e.key==='Tab'&&(sheet||confirmation)){const root=confirmation?$('#confirm-root'):$('#sheet-root'),items=Array.from(root.querySelectorAll('button:not(:disabled),input,textarea,[tabindex="0"]')).filter(x=>x.offsetParent!==null);if(!items.length)return;const first=items[0],last=items[items.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
function attachGrip(){const grip=$('#sheet-grip');if(!grip)return;let start=null;grip.addEventListener('pointerdown',e=>{if(e.button!==0)return;start={y:e.clientY};grip.setPointerCapture(e.pointerId);$('.sheet').style.animation='none';});grip.addEventListener('pointermove',e=>{if(!start)return;e.preventDefault();const y=Math.max(0,e.clientY-start.y);$('.sheet').style.transform='translateY('+y+'px)';});function end(e){if(!start)return;const delta=e.clientY-start.y;start=null;const el=$('.sheet');if(delta>65&&!sheet.dirty){el.style.animation='';requestClose();}else{el.style.transform='';el.style.animation='none';if(delta>65)requestClose();}}grip.addEventListener('pointerup',end);grip.addEventListener('pointercancel',()=>{start=null;const el=$('.sheet');el.style.transform='';el.style.animation='none';});}
$('#status-icons').innerHTML=icon('signal')+icon('wifi')+icon('battery');
$('#theme-control').onclick=()=>{state.mode=document.documentElement.dataset.theme==='dark'?'light':'dark';updateTheme();if(sheet&&sheet.type==='appearance')renderSheet();};
$('#width-control').onchange=e=>document.documentElement.style.setProperty('--phone-width',e.target.value+'px');
$('#reset-control').onclick=()=>{clearTimeout(closeTimer);dismissConfirm();sheet=null;closing=false;$('#sheet-root').innerHTML='';$('#device').classList.remove('sheet-open');state=initialState();render();$('#app-scroll').scrollTop=0;toast('演示数据已重置');};
$('#nav-back').onclick=()=>sheet?requestClose():route('my');
render();
</script>
</body>
</html>
